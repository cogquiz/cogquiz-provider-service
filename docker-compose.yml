version: '3.8'

services:
  provider-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - SERVICE_PORT=3003
      - SERVICE_NAME=cogquiz-provider-service
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - cogquiz-network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: doadmin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-AVNS_E5MP8yWoBDtO7jcU7D1}
      POSTGRES_DB: defaultdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cogquiz-network

networks:
  cogquiz-network:
    driver: bridge

volumes:
  pgdata:
